name: 올리브영 랭킹 크롤링

on:
  schedule:
    # 매 2시간마다 11분에 실행 (UTC 기준이지만 파일 저장은 KST)
    # 00:11, 02:11, 04:11, 06:11 ... 22:11 UTC
    - cron: '11 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 동시 실행 방지 (이전 실행이 안 끝났으면 대기)
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 한국 시간대 설정 → date 명령어, 커밋 메시지 등 모두 KST
    env:
      TZ: Asia/Seoul

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright 설치
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: 크롤링 실행
        run: python oliveyoung_scraper.py

      - name: 데이터 저장 (자동 커밋)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📊 랭킹 데이터 업데이트 $(date +'%Y-%m-%d %H:%M KST')"
          git push
