<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올리브영 브랜드 랭킹</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--oy-yellow:#F5FF50;--oy-yellow-bg:#F5FFB0;--oy-yellow-soft:#FAFFD6;--oy-black:#151515;--oy-bk7:rgba(21,21,21,.7);--oy-bk5:rgba(21,21,21,.5);--oy-bk3:rgba(21,21,21,.3);--oy-bk1:rgba(21,21,21,.1);--bg:#f7f7f5;--card:#fff;--border:#e8e8e4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--oy-black);-webkit-font-smoothing:antialiased;min-height:100vh}

/* Header */
.hd{background:var(--oy-black);padding:16px 32px;display:flex;align-items:center;gap:14px}
.hd h1{font-size:16px;font-weight:700;color:#fff}
.hd p{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.hd-status{margin-left:auto;font-size:11px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:6px}
.hd-status .dot{width:7px;height:7px;border-radius:50%;background:var(--oy-yellow);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Period filter */
.pf{background:var(--card);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pf-label{font-size:13px;font-weight:600;flex-shrink:0}
.pf-btns{display:flex;gap:5px;flex-wrap:wrap}
.pf-btn{padding:5px 13px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--oy-bk5);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.pf-btn:hover{border-color:var(--oy-bk3);color:var(--oy-black)}
.pf-btn.on{background:var(--oy-black);color:var(--oy-yellow);border-color:var(--oy-black);font-weight:700}
.dr{display:flex;align-items:center;gap:5px;margin-left:8px;padding-left:10px;border-left:1px solid var(--border)}
.dr input{padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;font-family:inherit;background:var(--bg);outline:none}
.dr input:focus{border-color:var(--oy-black)}
.dr span{font-size:11px;color:var(--oy-bk3)}
.dr button{padding:4px 10px;border-radius:5px;border:none;background:var(--oy-black);color:var(--oy-yellow);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}

/* Categories */
.cats{background:var(--card);border-bottom:1px solid var(--border);padding:12px 32px}
.cats-label{font-size:12px;color:var(--oy-bk5);margin-bottom:8px}
.cats-grid{display:flex;flex-wrap:wrap;gap:6px}
.cat-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--oy-bk7);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.cat-btn:hover{border-color:var(--oy-bk3);color:var(--oy-black)}
.cat-btn.on{background:var(--oy-yellow);color:var(--oy-black);border-color:var(--oy-yellow);font-weight:700}

/* Search */
.sb{background:var(--card);border-bottom:1px solid var(--border);padding:9px 32px;display:flex;gap:8px;align-items:center}
.sb input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);outline:none}
.sb input:focus{border-color:var(--oy-black)}
.sb button{padding:8px 16px;background:var(--oy-black);color:var(--oy-yellow);border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}

/* Main */
.main{display:flex;padding:14px 32px 40px;gap:14px;min-height:calc(100vh - 260px)}

/* Left */
.pl{width:360px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.pl-hd{padding:12px 16px;border-bottom:1px solid #f0f0ec;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;background:var(--oy-yellow-soft)}
.pl-hd .cnt{font-weight:400;color:var(--oy-bk5);font-size:12px}
.rl{flex:1;overflow-y:auto;max-height:620px}
.ri{display:flex;align-items:center;gap:7px;padding:10px 16px;border-bottom:1px solid #f7f7f5;cursor:pointer;transition:all .1s;border-left:3px solid transparent}
.ri:hover{background:var(--oy-yellow-soft)}
.ri.on{background:var(--oy-yellow-soft);border-left-color:var(--oy-black)}
.rn{width:22px;text-align:center;font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;color:var(--oy-bk3)}
.ri:nth-child(-n+3) .rn{color:var(--oy-black);font-size:14px}
.rc{width:24px;text-align:center;font-size:10px;font-weight:600}
.rc.up{color:#ef4444}.rc.dn{color:#3b82f6}.rc.sm{color:var(--oy-bk3)}.rc.nw{color:#f59e0b;font-weight:700}
.rname{flex:1;min-width:0;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbrand{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}

/* Right */
.pr{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.ch-hd{padding:14px 20px;border-bottom:1px solid #f0f0ec}
.ch-title{font-size:15px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.ch-title .tag{padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600;background:var(--oy-yellow);color:var(--oy-black)}
.ch-sub{font-size:12px;color:var(--oy-bk5)}
.ch-legend{padding:7px 20px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--oy-bk5);border-bottom:1px solid #f7f7f5}
.lg-i{display:flex;align-items:center;gap:4px}
.lg-l{width:12px;height:3px;border-radius:2px}
.ch-area{flex:1;padding:14px 14px 8px;position:relative;min-height:380px}
.ch-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--oy-bk3);font-size:13px}
.ch-empty .ic{font-size:36px}
.cmp-tog{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--oy-bk5);cursor:pointer;margin-left:auto}
.tog{width:32px;height:17px;border-radius:9px;background:#ddd;position:relative;transition:background .2s;cursor:pointer}
.tog.on{background:var(--oy-black)}
.tog-k{width:13px;height:13px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog.on .tog-k{left:17px;background:var(--oy-yellow)}

.ld{display:flex;align-items:center;justify-content:center;height:200px;color:var(--oy-bk3);font-size:13px;flex-direction:column;gap:12px}
.sp{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--oy-black);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ndb{background:#fffbe6;border:1px solid #f5edc8;border-radius:8px;padding:14px 20px;margin:14px 32px;font-size:13px;color:#8a7400;display:flex;align-items:flex-start;gap:8px}

@media(max-width:900px){
  .main{flex-direction:column;padding:10px}
  .pl{width:100%}
  .hd,.cats,.sb,.pf{padding-left:14px;padding-right:14px}
  .dr{margin-left:0;padding-left:0;border-left:none;margin-top:6px;width:100%}
}
</style>
</head>
<body>

<div class="hd">
  <div>
    <h1>올리브영 브랜드 랭킹</h1>
    <p>브랜드별 상품 랭킹 추이를 차트로 비교합니다</p>
  </div>
  <div class="hd-status"><span class="dot"></span><span id="lastUpdate">로딩 중...</span></div>
</div>

<div class="pf">
  <div class="pf-label">📅 기간</div>
  <div class="pf-btns" id="pfBtns"></div>
  <div class="dr">
    <input type="date" id="dFrom">
    <span>~</span>
    <input type="date" id="dTo">
    <button onclick="applyRange()">적용</button>
  </div>
</div>

<div class="cats">
  <div class="cats-label">🏷 카테고리</div>
  <div class="cats-grid" id="catGrid"></div>
</div>

<div class="sb">
  <span style="font-size:15px;color:var(--oy-bk3)">🔍</span>
  <input type="text" id="q" placeholder="상품명 또는 브랜드 검색">
  <button onclick="renderList()">검색</button>
</div>

<div class="ndb" id="ndb" style="display:none">
  <span style="font-size:15px">⚠️</span>
  <div><strong>아직 수집된 데이터가 없습니다.</strong><br>GitHub Actions에서 "Run workflow"를 실행해주세요.</div>
</div>

<div class="main">
  <div class="pl">
    <div class="pl-hd">📊 <span id="pTitle">랭킹</span> <span class="cnt" id="pCnt"></span></div>
    <div class="rl" id="rl"><div class="ld"><div class="sp"></div>로딩 중...</div></div>
  </div>
  <div class="pr">
    <div class="ch-hd">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div class="ch-title"><span id="chCat">[전체]</span> 랭킹 트렌드 <span class="tag" id="chTag">전체</span></div>
          <div class="ch-sub" id="chSub">상품을 선택하세요</div>
        </div>
        <div class="cmp-tog" onclick="toggleCmp()">
          📊 비교
          <div class="tog" id="cmpTog"><div class="tog-k"></div></div>
        </div>
      </div>
    </div>
    <div class="ch-legend">
      <span class="lg-i"><span class="lg-l" style="background:#22c55e"></span>정상판매</span>
      <span class="lg-i"><span class="lg-l" style="background:#ef4444"></span>할인</span>
      <span class="lg-i"><span class="lg-l" style="background:#151515"></span>품절</span>
      <span class="lg-i"><span class="lg-l" style="background:#9ca3af"></span>순위권 밖</span>
    </div>
    <div class="ch-area">
      <canvas id="cv"></canvas>
      <div class="ch-empty" id="chE"><span class="ic">📈</span>왼쪽에서 상품을 선택하세요</div>
    </div>
  </div>
</div>

<script>
// ══════════ CONFIG ══════════
const GH_USER = "timikim-a11y";
const GH_REPO = "oliveyoung-ranking";
// ════════════════════════════

const RAW = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/data`;
const API = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/data`;

const CATS = [
  "전체","스킨케어","마스크팩","클렌징","선케어","메이크업","네일","뷰티소품",
  "더모코스메틱","맨즈에딧","향수/디퓨저","헤어케어","바디케어",
  "건강식품","푸드","구강용품","헬스/건강용품","위생용품","패션","홈리빙/가전","취미/팬시"
];
const CMP_C = ["#151515","#ef4444","#22c55e","#f59e0b","#3b82f6"];

// ── KST helpers ──
// updated_at은 이미 KST ISO string (예: "2026-04-23T15:11:00+09:00")
// 또는 UTC ISO string → 항상 Date로 파싱 후 KST 포맷
function kst(s) {
  const d = new Date(s);
  // JS Date는 로컬타임으로 변환하므로, 강제로 KST offset 적용
  const utc = d.getTime() + d.getTimezoneOffset() * 60000;
  return new Date(utc + 9 * 3600000);
}
function fmtFull(s) { const d=kst(s); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${S(d.getHours())}:${S(d.getMinutes())} KST`; }
function fmtShort(s) { const d=kst(s); return `${d.getMonth()+1}/${d.getDate()} ${S(d.getHours())}:${S(d.getMinutes())}`; }
function kstDate(s) { const d=kst(s); return `${d.getFullYear()}-${S(d.getMonth()+1)}-${S(d.getDate())}`; }
function kstMonth(s) { const d=kst(s); return `${d.getFullYear()}-${S(d.getMonth()+1)}`; }
function S(n) { return String(n).padStart(2,"0"); }

// ── State ──
let allFiles=[], allData=[], fData=[];
let curCat="전체", curPeriod="all", selProd=null, cmpMode=false, cmpList=[], chart=null;

// ── Init ──
document.addEventListener("DOMContentLoaded", async()=>{
  renderCats();
  document.getElementById("q").addEventListener("keyup",e=>{if(e.key==="Enter")renderList()});
  const t=new Date(), ts=t.toISOString().split("T")[0];
  const m=new Date(t); m.setMonth(m.getMonth()-1);
  document.getElementById("dTo").value=ts;
  document.getElementById("dFrom").value=m.toISOString().split("T")[0];
  await load();
});

async function load() {
  try {
    const r=await fetch(API); if(!r.ok) throw 0;
    const files=await r.json();
    allFiles=files.filter(f=>f.name.endsWith(".json")&&f.name!=="latest.json"&&f.name!==".gitkeep").sort((a,b)=>a.name.localeCompare(b.name));
    if(!allFiles.length) throw 0;

    // 병렬 로드 (최근 100개, 5개씩 배치)
    const toLoad=allFiles.slice(-100);
    allData=[];
    for(let i=0;i<toLoad.length;i+=5){
      const batch=toLoad.slice(i,i+5);
      const res=await Promise.allSettled(batch.map(f=>fetch(f.download_url).then(r=>r.json())));
      res.forEach(r=>{if(r.status==="fulfilled")allData.push(r.value)});
    }
    renderPeriod(); applyFilter();
    document.getElementById("ndb").style.display="none";
  } catch(e) {
    try {
      const r=await fetch(`${RAW}/latest.json`);
      if(!r.ok) throw 0;
      const d=await r.json();
      allData=[d]; fData=[d]; renderPeriod(); showTime(d); renderList();
      document.getElementById("ndb").style.display="none";
    } catch {
      document.getElementById("ndb").style.display="flex";
      document.getElementById("rl").innerHTML='<div class="ld" style="color:var(--oy-bk3)">데이터 없음</div>';
    }
  }
}

// ── Period ──
function renderPeriod() {
  const months=new Set();
  allData.forEach(d=>{if(d.updated_at)months.add(kstMonth(d.updated_at))});
  const sorted=[...months].sort().reverse();
  const c=document.getElementById("pfBtns");
  let h='';
  [["all","전체"],["today","오늘"],["7d","7일"],["30d","30일"]].forEach(([k,l])=>{
    h+=`<button class="pf-btn ${curPeriod===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`;
  });
  sorted.forEach(m=>{
    const[y,mo]=m.split("-");
    h+=`<button class="pf-btn ${curPeriod===m?'on':''}" onclick="setPeriod('${m}')">${y}년 ${+mo}월</button>`;
  });
  c.innerHTML=h;
}

function setPeriod(p){curPeriod=p;renderPeriod();applyFilter();}

function applyFilter(){
  const now=kst(new Date().toISOString());
  if(curPeriod==="all") fData=[...allData];
  else if(curPeriod==="today"){
    const td=`${now.getFullYear()}-${S(now.getMonth()+1)}-${S(now.getDate())}`;
    fData=allData.filter(d=>kstDate(d.updated_at)===td);
  } else if(curPeriod==="7d"){
    const cut=new Date(now.getTime()-7*864e5);
    fData=allData.filter(d=>kst(d.updated_at)>=cut);
  } else if(curPeriod==="30d"){
    const cut=new Date(now.getTime()-30*864e5);
    fData=allData.filter(d=>kst(d.updated_at)>=cut);
  } else {
    fData=allData.filter(d=>kstMonth(d.updated_at)===curPeriod);
  }
  if(!fData.length&&allData.length) fData=allData.slice(-1);
  if(fData.length) showTime(fData[fData.length-1]);
  renderList(); updateChart();
}

function applyRange(){
  const f=document.getElementById("dFrom").value, t=document.getElementById("dTo").value;
  if(!f||!t)return;
  curPeriod="custom"; renderPeriod();
  const fd=new Date(f+"T00:00:00"), td=new Date(t+"T23:59:59");
  fData=allData.filter(d=>{const k=kst(d.updated_at);return k>=fd&&k<=td});
  if(!fData.length&&allData.length)fData=allData.slice(-1);
  if(fData.length)showTime(fData[fData.length-1]);
  renderList(); updateChart();
}

function showTime(d){document.getElementById("lastUpdate").textContent=`마지막 업데이트: ${fmtFull(d.updated_at)}`;}

// ── Categories ──
function renderCats(){
  document.getElementById("catGrid").innerHTML=CATS.map(c=>
    `<button class="cat-btn ${c===curCat?'on':''}" onclick="setCat('${c}')">${c}</button>`
  ).join("");
}
function setCat(c){
  curCat=c; selProd=null; cmpList=[];
  renderCats(); renderList(); updateChart();
  document.getElementById("chCat").textContent=`[${c}]`;
  document.getElementById("chTag").textContent=c;
}

// ── Ranking list ──
function renderList(){
  const el=document.getElementById("rl");
  if(!fData.length){el.innerHTML='<div class="ld" style="color:var(--oy-bk3)">데이터 없음</div>';return}

  const latest=fData[fData.length-1];
  let prods=latest.products||[];

  // ★ 핵심: 카테고리 필터 — 해당 카테고리로 크롤링된 데이터만 표시
  if(curCat!=="전체") prods=prods.filter(p=>p.category===curCat);

  const q=document.getElementById("q").value.trim().toLowerCase();
  if(q) prods=prods.filter(p=>(p.brand||"").toLowerCase().includes(q)||(p.name||"").toLowerCase().includes(q));
  prods.sort((a,b)=>(a.rank||999)-(b.rank||999));

  document.getElementById("pTitle").textContent=`${curCat} 랭킹`;
  document.getElementById("pCnt").textContent=`(${prods.length})`;

  if(!prods.length){el.innerHTML='<div class="ld" style="color:var(--oy-bk3)">데이터가 없습니다</div>';return}

  el.innerHTML=prods.map((p,i)=>{
    const isOn=!cmpMode&&selProd&&selProd.brand===p.brand&&selProd.name===p.name&&selProd.category===p.category;
    const isCmp=cmpMode&&cmpList.find(c=>c.brand===p.brand&&c.name===p.name&&c.category===p.category);
    const ci=cmpList.findIndex(c=>c.brand===p.brand&&c.name===p.name&&c.category===p.category);

    let ch='';
    if(fData.length>=2){
      const prev=fData[fData.length-2];
      const pi=(prev.products||[]).find(pp=>pp.brand===p.brand&&pp.name===p.name&&pp.category===p.category);
      if(pi){const d=(pi.rank||999)-(p.rank||999);
        ch=d>0?`<div class="rc up">▲${d}</div>`:d<0?`<div class="rc dn">▼${Math.abs(d)}</div>`:`<div class="rc sm">-</div>`;
      }else ch=`<div class="rc nw">NEW</div>`;
    }
    const hue=((p.brand||"").charCodeAt(0)*37)%360;
    return `<div class="ri ${isOn||isCmp?'on':''}" onclick="sel(${i})">
      <div class="rn">${p.rank||i+1}</div>${ch}
      <div class="rname">${isCmp?`<span style="color:${CMP_C[ci]};font-size:9px">● </span>`:''}${trunc(p.name,28)}</div>
      <div class="rbrand" style="background:hsl(${hue},70%,94%);color:hsl(${hue},55%,35%)">${p.brand||''}</div>
    </div>`;
  }).join("");
  el._p=prods;
}

function trunc(s,n){return !s?'':s.length>n?s.slice(0,n)+'...':s}

function sel(i){
  const p=document.getElementById("rl")._p;if(!p||!p[i])return;
  const prod=p[i];
  if(cmpMode){
    const x=cmpList.findIndex(c=>c.brand===prod.brand&&c.name===prod.name&&c.category===prod.category);
    if(x>=0)cmpList.splice(x,1);else if(cmpList.length<5)cmpList.push(prod);
    renderList();updateChart();return;
  }
  selProd=prod;renderList();updateChart();
}

// ── Chart ──
function updateChart(){
  const ee=document.getElementById("chE"),cv=document.getElementById("cv"),sub=document.getElementById("chSub");

  if(cmpMode&&!cmpList.length){empty("📊","비교할 상품을 선택하세요 (최대 5개)");sub.textContent="상품을 선택하세요";return}
  if(!cmpMode&&!selProd){empty("📈","왼쪽에서 상품을 선택하세요");sub.textContent="상품을 선택하세요";return}

  ee.style.display="none";cv.style.display="block";

  const labels=fData.map(d=>fmtShort(d.updated_at));
  let ds=[];

  if(cmpMode){
    cmpList.forEach((p,i)=>{
      const data=fData.map(snap=>{
        const f=(snap.products||[]).find(sp=>sp.brand===p.brand&&sp.name===p.name&&sp.category===p.category);
        return f?(f.rank||null):null;
      });
      ds.push({label:p.brand,data,borderColor:CMP_C[i],backgroundColor:CMP_C[i]+"15",borderWidth:2.5,pointRadius:3,pointBackgroundColor:CMP_C[i],tension:.3,spanGaps:true});
    });
    sub.textContent=cmpList.map(p=>`${p.brand}(${p.rank}위)`).join(' · ');
  } else {
    const data=fData.map(snap=>{
      const f=(snap.products||[]).find(sp=>sp.brand===selProd.brand&&sp.name===selProd.name&&sp.category===selProd.category);
      return f?(f.rank||null):null;
    });
    ds.push({label:selProd.brand,data,borderColor:"#151515",backgroundColor:"rgba(245,255,80,.15)",borderWidth:2.5,pointRadius:3,pointBackgroundColor:"#151515",tension:.3,fill:true,spanGaps:true});
    sub.textContent=`${selProd.name} · ${selProd.brand} · ${selProd.rank}위`;
  }

  if(chart)chart.destroy();
  chart=new Chart(cv,{type:"line",data:{labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{
      legend:{display:cmpMode,position:"top",labels:{font:{size:11,family:"'Noto Sans KR'"}}},
      tooltip:{backgroundColor:"#fff",titleColor:"#151515",bodyColor:"#666",borderColor:"#e5e7eb",borderWidth:1,padding:10,
        titleFont:{family:"'Noto Sans KR'",weight:"600"},bodyFont:{family:"'Noto Sans KR'"},
        callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y}위`}}
    },
    scales:{
      y:{reverse:true,min:1,suggestedMax:30,ticks:{callback:v=>v+"위",font:{size:11},color:"rgba(21,21,21,.3)"},grid:{color:"rgba(21,21,21,.04)"}},
      x:{ticks:{font:{size:10},color:"rgba(21,21,21,.3)",maxRotation:45,autoSkip:true,maxTicksLimit:10},grid:{display:false}}
    }
  }});
}

function empty(ic,txt){
  const e=document.getElementById("chE"),c=document.getElementById("cv");
  e.style.display="flex";e.innerHTML=`<span class="ic">${ic}</span>${txt}`;
  c.style.display="none";if(chart){chart.destroy();chart=null}
}
function toggleCmp(){
  cmpMode=!cmpMode;cmpList=[];
  document.getElementById("cmpTog").classList.toggle("on",cmpMode);
  renderList();updateChart();
}
</script>
</body>
